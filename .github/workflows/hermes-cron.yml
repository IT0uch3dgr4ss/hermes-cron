          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="📅 **Resumen Semanal** ($GITHUB_RUN_NUMBER)%0A%0A${RESULT}" \
            -d parse_mode="Markdown"

  # Notify on failure
  notify-failure:
    name: 🔔 Notify on failure
    if: failure()
    needs: [news-spain, news-ai, news-tech, weekly-summary]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ **Hermes cron job failed**: ${{ github.workflow }} - ${{ github.job }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode="Markdown"