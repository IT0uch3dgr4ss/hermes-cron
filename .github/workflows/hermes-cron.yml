name: Hermes Cron Jobs (OpenRouter Free)

on:
  schedule:
    # Daily 08:00 CEST = 06:00 UTC
    - cron: '0 6 * * *'
    # Daily 08:15 CEST = 06:15 UTC
    - cron: '15 6 * * *'
    # Daily 08:30 CEST = 06:30 UTC
    - cron: '30 6 * * *'
    # Weekly Monday 07:00 CEST = 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI/API

jobs:
  # Job 1: Resumen noticias España (08:00 CEST)
  news-spain:
    name: 📰 Resumen noticias España
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install --upgrade pip
          pip install hermes-agent

      - name: Run Spain News Summary (with retry)
        id: spain
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: mistralai/mistral-7b-instruct:free
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            OUTPUT=$(hermes -z "
            Busca las principales noticias de España de las últimas 24 horas. Usa búsqueda web para encontrar fuentes fiables (El País, El Mundo, ABC, 20minutos, RTVE, Europa Press). Genera un resumen ejecutivo en español con:

            1. **Política** (2-3 titulares clave)
            2. **Economía/Empresa** (2-3 titulares clave)
            3. **Sociedad/Sucesos** (1-2 titulares)
            4. **Deportes** (1-2 titulares)
            5. **Internacional relevante para España** (1 titular)

            Formato: bullets concisos, una línea por item, fuente entre paréntesis. ~150-200 palabras. Tono periodístico neutral.
            " chat --skill web 2>&1)
            
            if echo "$OUTPUT" | grep -q "HTTP 401"; then
              echo "Authentication error (401) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 400"; then
              echo "Bad request (400) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 429"; then
              echo "Rate limited (429) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 5[0-9][0-9]"; then
              echo "Server error - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            else
              echo "$OUTPUT" | tail -20
              echo "result<<EOF" >> $GITHUB_OUTPUT
              echo "$OUTPUT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Success on attempt $attempt"
              exit 0
            fi
          done
          
          echo "All retries failed. Last output:"
          echo "$OUTPUT"
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit 1

      - name: Send to Telegram
        if: always()
        run: |
          RESULT="${{ steps.spain.outputs.result }}"
          # Truncate if too long for Telegram (4096 chars)
          if [ ${#RESULT} -gt 4000 ]; then
            RESULT="${RESULT:0:4000}... [truncated]"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="📰 **Resumen Noticias España** ($GITHUB_RUN_NUMBER)%0A%0A${RESULT}" \
            -d parse_mode="Markdown"

  # Job 2: Resumen IA (08:15 CEST)
