      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install --upgrade pip
          pip install hermes-agent

      - name: Run Tech/Startups Summary (with retry)
        id: tech
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: mistralai/mistral-7b-instruct:free
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            OUTPUT=$(hermes -z "
            Busca las noticias más relevantes de Tech, Startups y Venture Capital de las últimas 24-48 horas. Fuentes: TechCrunch, The Information, Bloomberg Tech, Reuters Tech, Crunchbase News, PitchBook, El Confidencial Tecnología, CincoDías, Sifted, EU-Startups. Resumen ejecutivo en español con:

            1. **Rondas de financiación** (Series A/B/C >10M€, nombres + cantidad + sector)
            2. **Salidas/Exits** (IPOs, M&A relevantes)
            3. **Big Tech** (movimientos estratégicos, productos, regulación)
            4. **Ecosistema español/latam** (si hay rondas/operaciones destacadas)
            5. **Tendencias/Análisis** (un dato/señal de mercado relevante)

            Formato: bullets, una línea por item, fuente entre paréntesis. ~150-200 palabras. Tono business/tech.
            " chat --skill web 2>&1)
            
            if echo "$OUTPUT" | grep -q "HTTP 401"; then
              echo "Authentication error (401) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 400"; then
              echo "Bad request (400) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 429"; then
              echo "Rate limited (429) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 5[0-9][0-9]"; then
              echo "Server error - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            else
              echo "$OUTPUT" | tail -20
              echo "result<<EOF" >> $GITHUB_OUTPUT
              echo "$OUTPUT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Success on attempt $attempt"
              exit 0
            fi
          done
          
          echo "All retries failed. Last output:"
          echo "$OUTPUT"
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit 1

      - name: Send to Telegram
        if: always()
        run: |
          RESULT="${{ steps.tech.outputs.result }}"
          if [ ${#RESULT} -gt 4000 ]; then
