            -d parse_mode="Markdown"

  # Job 4: Resumen Semanal (Lunes 07:00 CEST)
  weekly-summary:
    name: 📅 Resumen Semanal
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install --upgrade pip
          pip install hermes-agent

      - name: Run Weekly Summary (with retry)
        id: weekly
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: mistralai/mistral-7b-instruct:free
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            OUTPUT=$(hermes -z "
            Genera un resumen semanal ejecutivo (lunes 07:00) compilando lo más relevante de la semana anterior en España y mundo tech/IA. Estructura:

            ## 📅 Semana del [fecha lunes] al [fecha domingo]

            ### 🇪🇸 España - Política & Economía (3-4 bullets)
            ### 🤖 IA & Investigación (3-4 bullets: modelos, papers, industry)
            ### 💻 Tech & Startups (3-4 bullets: rondas, exits, big tech)
            ### 📊 Dato de la semana (1 métrica/gráfico/dato sorprendente con fuente)
            ### 🔮 Señal a vigilar (1 tendencia emergente)

            Fuentes: mismas que trabajos diarios + newsletters semanales (The Batch, Stratechery, Exponential View, Benedict Evans, etc.). Formato: bullets concisos, fuente entre paréntesis. ~300-400 palabras. Tono ejecutivo/estratégico.
            " chat --skill web 2>&1)
            
            if echo "$OUTPUT" | grep -q "HTTP 401"; then
              echo "Authentication error (401) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 400"; then
              echo "Bad request (400) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 429"; then
              echo "Rate limited (429) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 5[0-9][0-9]"; then
              echo "Server error - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            else
              echo "$OUTPUT" | tail -30
              echo "result<<EOF" >> $GITHUB_OUTPUT
              echo "$OUTPUT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Success on attempt $attempt"
              exit 0
            fi
          done
          
          echo "All retries failed. Last output:"
          echo "$OUTPUT"
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
