          pip install --upgrade pip
          pip install hermes-agent

      - name: Run AI Summary (with retry)
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: mistralai/mistral-7b-instruct:free
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            OUTPUT=$(hermes -z "
            Busca las noticias más relevantes de Inteligencia Artificial de las últimas 24-48 horas. Fuentes: The Batch (deeplearning.ai), MIT Technology Review AI, VentureBeat AI, The Verge AI, ArXiv (cs.AI, cs.CL, cs.LG), blogs de OpenAI, Anthropic, Google DeepMind, Meta AI, Microsoft Research, NVIDIA. Resumen ejecutivo en español con:

            1. **Nuevos modelos/releases** (nombres, capacidades, benchmarks si hay)
            2. **Investigación destacada** (papers con impacto, autores clave)
            3. **Industria/Big Tech** (anuncios, partnerships, funding, regulación)
            4. **Herramientas/Framework** (nuevas librerías, updates mayores)
            5. **Aplicaciones/Casos de uso** (deployments reales, productos)

            Formato: bullets, una línea por item, fuente entre paréntesis. ~150-200 palabras. Tono técnico pero accesible.
            " chat --skill web 2>&1)
            
            if echo "$OUTPUT" | grep -q "HTTP 401"; then
              echo "Authentication error (401) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 400"; then
              echo "Bad request (400) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 429"; then
              echo "Rate limited (429) - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            elif echo "$OUTPUT" | grep -q "HTTP 5[0-9][0-9]"; then
              echo "Server error - retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            else
              echo "$OUTPUT" | tail -20
              echo "result<<EOF" >> $GITHUB_OUTPUT
              echo "$OUTPUT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Success on attempt $attempt"
              exit 0
            fi
          done
          
          echo "All retries failed. Last output:"
          echo "$OUTPUT"
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit 1

      - name: Send to Telegram
        if: always()
        run: |
          RESULT="${{ steps.ai.outputs.result }}"
          if [ ${#RESULT} -gt 4000 ]; then
            RESULT="${RESULT:0:4000}... [truncated]"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🤖 **Resumen IA** ($GITHUB_RUN_NUMBER)%0A%0A${RESULT}" \
            -d parse_mode="Markdown"

  # Job 3: Resumen Tech/Startups (08:30 CEST)
  news-tech:
    name: 💻 Resumen Tech/Startups
    if: github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
