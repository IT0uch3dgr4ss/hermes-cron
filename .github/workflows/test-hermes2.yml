name: Test Hermes Explicit Key
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Hermes
        run: |
          pip install --upgrade pip
          pip install hermes-agent
      
      - name: Test Hermes with explicit --model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          hermes -z "Responde solo: OK" chat --skill web \
            --model nvidia/nemotron-3-ultra-550b-a55b \
            --provider nvidia \
            --api-key "$NVIDIA_API_KEY" \
            --base-url https://integrate.api.nvidia.com/v1 2>&1
      
      - name: Test Hermes with config file
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > hermes-config.yaml << HERMESEOF
          model:
            provider: nvidia
            name: nvidia/nemotron-3-ultra-550b-a55b
            base_url: https://integrate.api.nvidia.com/v1
            api_key: "$NVIDIA_API_KEY"
          HERMESEOF
          hermes -z "Responde solo: OK" chat --skill web --config hermes-config.yaml 2>&1
